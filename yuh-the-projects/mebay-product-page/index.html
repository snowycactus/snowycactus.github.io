<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mothman Plushie</title>
        <link href="css/style.css" rel="stylesheet">
        <link 
            rel="stylesheet" 
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" 
            integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" 
            crossorigin="anonymous" 
            referrerpolicy="no-referrer"
        >
    </head>
    <body>
        <div id="headbar">
            <img
                src="images/ebay.jpg"
                alt="a tomato cat stares at you"
            >
        <hr>
        </div>
        <!-- FLEXBOX CONTAINER -->
        <div id="layout">
            <!-- FLEXBOX ITEM -->
            <div id="thumbnail-column">
                <img
                    src="images/MOTHMAN1.avif"
                    alt="a tomato cat stares at you"
                >
                <img
                    src="images/mini_baby_mothman_side.webp"
                    alt="a tomato cat stares at you"
                >
                <img
                    src="images/MOTHMAN_closed.webp"
                    alt="a tomato cat stares at you"
                >
                <img
                    src="images/mini_baby_mothman_back_open.webp"
                    alt="a tomato cat stares at you"
                >
                <img
                    src="images/MOTHMAN_closedback.webp"
                    alt="a tomato cat stares at you"
                >
            </div>

              <!-- FLEXBOX ITEM -->
            <div id="main-image">
                <img
                    src="images/MOTHMAN1.avif"
                    alt="a tomato cat stares at you"
                >
            </div>

              <!-- FLEXBOX ITEM -->
            <div id="product-info">
                <h1>Mini Squishable Mothman Plush</h1>
                <hr>
                <div id="seller">
                    <div id="sellerimg">
                        <img
                            src="images/sillycat.jpg"
                            alt="a tomato cat stares at you"
                        >
                    </div>
                    <div id="textseller">
                        <span>Yuh_the_Cat</span>
                        &nbsp;
                        <span id="number">(12)</span>
                        <br>
                            <a href="#">100% Positive</a>
                            &bull;
                            <a href="#">Sellers Other Items</a>
                            &bull;
                            <a href="#">Contact Seller</a>
                    </div>
                </div>
                <hr>
                
                <h1>USD $25.00</h1>
                <p>
                    Condition: <b>NEW</b>
                    <i class="fa-solid fa-circle-info"></i>
                </p>
                <div id="buttons">
                    <a href="#" class="primary">Buy it Now</a>
                    <a href="#" class="secondary">Add to Cart</a>
                    <a href="#" class="secondary">Add to Watchlist</a>
                </div>
                <div id="flash">
                    <h1><i class="fa-solid fa-bolt"></i></h1>
                    <p>
                        <b>Popular Item.</b> 3 have already sold.
                    </p>
                </div>
                <div id="flash">
                    <h1><i class="fa-solid fa-bolt"></i></h1>
                    <p>
                        <b>People are checking this out.</b> 
                        9 are in carts.
                    </p>
                </div>
            </div>
        </div>
    </body>
</html>
